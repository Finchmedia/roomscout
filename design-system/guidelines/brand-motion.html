<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 22px;font-family:var(--font-sans);color:var(--rs-ink)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{flex:1;min-width:88px;display:flex;flex-direction:column;gap:6px}.s i{display:block;height:54px;border-radius:12px;border:1px solid rgba(255,255,255,.06)}.s b{font-weight:500;font-size:12px}.s small{font-size:11px;color:var(--rs-ink-6);font-family:var(--font-mono)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;font-size:12px;color:var(--rs-ink-2)"><div style="padding:12px 14px;border-radius:14px;background:var(--rs-surface-card);border:1px solid var(--rs-border-card)"><div style="font-weight:500">ease-out-soft</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--rs-ink-6);margin-top:4px">cubic-bezier(.22,.8,.2,1)</div><div style="margin-top:6px;color:var(--rs-ink-4)">Layout-Morph, Blob-Position</div></div><div style="padding:12px 14px;border-radius:14px;background:var(--rs-surface-card);border:1px solid var(--rs-border-card)"><div style="font-weight:500">ease-out-snap</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--rs-ink-6);margin-top:4px">cubic-bezier(.3,.7,.2,1)</div><div style="margin-top:6px;color:var(--rs-ink-4)">Kapsel-Flug, Accordion</div></div><div style="padding:12px 14px;border-radius:14px;background:var(--rs-surface-card);border:1px solid var(--rs-border-card)"><div style="font-weight:500">fast / quick</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--rs-ink-6);margin-top:4px">.15s / .2s</div><div style="margin-top:6px;color:var(--rs-ink-4)">Hover, Switch, Menü</div></div><div style="padding:12px 14px;border-radius:14px;background:var(--rs-surface-card);border:1px solid var(--rs-border-card)"><div style="font-weight:500">slow / morph</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--rs-ink-6);margin-t
