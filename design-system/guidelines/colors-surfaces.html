<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 22px;font-family:var(--font-sans);color:var(--rs-ink)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{flex:1;min-width:88px;display:flex;flex-direction:column;gap:6px}.s i{display:block;height:54px;border-radius:12px;border:1px solid rgba(255,255,255,.06)}.s b{font-weight:500;font-size:12px}.s small{font-size:11px;color:var(--rs-ink-6);font-family:var(--font-mono)}.bgwrap{position:relative;border-radius:14px;overflow:hidden;padding:14px}.bgwrap .rs-bg{position:absolute}</style></head><body><div class="bgwrap"><div class="rs-bg"></div><div class="rs-grain"></div><div style="position:relative"><div class="sw"><div class="s"><i style="background:#0b0a09"></i><b>Page</b><small>--rs-surface-page</small></div><div class="s"><i style="background:rgba(18,14,12,.72)"></i><b>Card</b><small>--rs-surface-card</small></div><div class="s"><i style="background:rgba(18,14,12,.66)"></i><b>Card soft</b><small>--rs-surface-card-soft</small></div><div class="s"><i style="background:rgba(20,14,10,.55)"></i><b>Pill</b><small>--rs-surface-pill</small></div><div class="s"><i style="background:rgba(13,10,8,.8)"></i><b>Panel</b><small>--rs-surface-panel</small></div><div class="s"><i style="background:rgba(20,15,12,.96)"></i><b>Menu</b><small>--rs-surface-menu</small></div><div class="s"><i style="background:rgba(255,255,255,.04)"></i><b>Subtle</b><small>--rs-surface-subtle</small></div><div class="s"><i style="background:rgba(255,255,255,.1)"></i><b>Hover</b><small>--rs-surface-hover</small></div><div class="s"><i style="background:rgba(255,105,38,.16)"></i><b>Accent tint</b><small>--rs-surface-accent-tint</small></div></div></div></div></body></html>
