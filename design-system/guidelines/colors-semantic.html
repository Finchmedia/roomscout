<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 22px;font-family:var(--font-sans);color:var(--rs-ink)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{flex:1;min-width:88px;display:flex;flex-direction:column;gap:6px}.s i{display:block;height:54px;border-radius:12px;border:1px solid rgba(255,255,255,.06)}.s b{font-weight:500;font-size:12px}.s small{font-size:11px;color:var(--rs-ink-6);font-family:var(--font-mono)}</style></head><body><div class="sw"><div class="s"><i style="background:#b8382a"></i><b>Danger</b><small>--rs-red</small></div><div class="s"><i style="background:#c9463a"></i><b>Danger hover</b><small>--rs-red-hover</small></div><div class="s"><i style="background:#ff8a6a"></i><b>Error text</b><small>--rs-red-text</small></div><div class="s"><i style="background:#e0a13a"></i><b>Warning</b><small>--rs-amber</small></div><div class="s"><i style="background:#4fbf7a"></i><b>Success</b><small>--rs-green</small></div><div class="s"><i style="background:rgba(120,58,22,.75)"></i><b>User bubble</b><small>--rs-rust</small></div></div></body></html>
